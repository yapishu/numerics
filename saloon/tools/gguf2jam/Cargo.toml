[package]
name = "gguf2jam"
version = "0.1.0"
edition = "2021"
description = "Convert model weights (safetensors, GGUF) to jammed Hoon nouns for Maroon"

[[bin]]
name = "gguf2jam"
path = "src/main.rs"

[dependencies]
axsys-noun = "0.1"
safetensors = "0.7"
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
half = "2"

[profile.release]
opt-level = 3
lto = true
